{% extends "base.html" %}
{% load crispy_forms_filters %}

{% block title %}
	<title>Create car</title>
{% endblock %}

{% block content %}
	<h1>{{ object|yesno:"Update, Create" }} Car</h1>
  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input
        type="submit"
        value="{{ object|yesno:"Update, Create" }}"
        class="btn btn-primary"
    >
  </form>
{% endblock %}
