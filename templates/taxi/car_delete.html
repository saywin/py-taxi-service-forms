{% extends "base.html" %}


{% block title %}
	<title>Delete {{ car.model }}</title>
{% endblock %}


{% block content %}
	<h1>Delete car {{ car.model }}</h1>
  <p>Are you sure to delete car - {{ car.model }}</p>
  <div class="d-flex align-items-center">
    <a href="{% url 'taxi:car-list' %}" class="btn btn-secondary mr-5">Cancel</a>

    <form action="" method="post" class="m-0">
      {% csrf_token %}
      <input type="submit" value="Delete" class="btn btn-danger">
    </form>
  </div>
{% endblock %}
